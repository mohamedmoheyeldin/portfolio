<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1447e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16245a" media="(prefers-color-scheme: dark)" />
    <!-- Before first paint: the saved or system color theme, so the page never flashes the wrong one. -->
    <!-- The "js" class lets CSS show controls that need JavaScript and start the load animations. -->
    <script>var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))d.classList.add('dark-mode')}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <!-- Self-hosted fonts (see global.css). Preload the two faces on the first screen: the wordmark and the text. -->
    <link rel="preload" href="/src/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Mohamed Moheyeldin — Portfolio</title>
    <!--page-meta-->
  </head>
  <body><div id="root"><!--app-html--></div><script type="module" src="/src/main.tsx"></script></body>
</html>
